<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo-area">
            <img src="https://img1.pixhost.to/images/7814/630179889_imgtmp.jpg" alt="Logo" class="logo">
            <h1 class="brand"><span class="blue">STORE</span> DEV</h1>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle">☀️</button>
            <button class="hamburger" id="hamburgerBtn">☰</button>
        </div>
    </header>

    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="payment.html">Payment</a>
        <a href="product.html">Product</a>
        <a href="saluran.html">Saluran</a>
    </nav>

    <section style="padding:20px;">
        <h2>Produk Kami</h2>
        <ul>
            <li>Website Custom</li>
            <li>Aplikasi Android</li>
            <li>Bot Telegram & WhatsApp</li>
        </ul>
    </section>

    <script>
        const toggle = document.getElementById('themeToggle');
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            toggle.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        });

        const hamburger = document.getElementById('hamburgerBtn');
        const menu = document.getElementById('menu');
        hamburger.addEventListener('click', () => {
            menu.classList.toggle('menu-open');
        });
    </script>
</body>
</html>
