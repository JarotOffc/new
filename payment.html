<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - STORE DEV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo-area">
            <img src="https://img1.pixhost.to/images/7814/630179889_imgtmp.jpg" alt="Logo" class="logo">
            <h1 class="brand"><span class="blue">STORE</span> DEV</h1>
        </div>
        <button class="theme-toggle" id="themeToggle">☀️</button>
    </header>

    <!-- CONTENT -->
    <section class="hero">
        <h2 class="tagline">Metode Pembayaran</h2>
        <p class="description">
            Kami menerima berbagai metode pembayaran untuk kenyamanan Anda:
        </p>
        <ul style="list-style:none; padding:0;">
            <li>💳 Kartu Kredit/Debit (Visa, MasterCard)</li>
            <li>🏦 Transfer Bank</li>
            <li>📱 E-Wallet (Dana, OVO, GoPay)</li>
            <li>💵 COD (Bayar di Tempat)</li>
        </ul>
    </section>

    <!-- MENU -->
    <nav class="menu">
        <a href="payment.html">Payment</a>
        <a href="product.html">Product</a>
        <a href="index.html">Home</a>
    </nav>

    <script>
        const toggle = document.getElementById('themeToggle');
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            toggle.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
