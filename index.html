<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oscar Dev - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding: 20px;
    }

    .coding-anim-container {
      position: relative;
      height: 1.5em; /* tinggi 1 baris teks */
      margin-top: 30px;
      font-family: monospace, monospace;
      font-size: 16px;
      line-height: 1.5;
      overflow: visible;
    }

    .code-line {
      position: absolute;
      width: 100%;
      opacity: 0;
      animation: fadeInOut 4s linear infinite;
      white-space: nowrap;
    }

    .code-line:nth-child(1) { animation-delay: 0s; }
    .code-line:nth-child(2) { animation-delay: 1s; }
    .code-line:nth-child(3) { animation-delay: 2s; }
    .code-line:nth-child(4) { animation-delay: 3s; }

    @keyframes fadeInOut {
      0%, 20%, 100% { opacity: 0; }
      10%, 15% { opacity: 1; }
    }

    .wa-logo {
      position: absolute;
      right: 0;
      bottom: -40px;
      width: 35px;
      height: 35px;
      cursor: pointer;
      filter: drop-shadow(0 0 3px #25d366);
      transition: transform 0.3s ease;
    }

    .wa-logo:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <h1>Welcome to Oscar Dev</h1>

  <div class="coding-anim-container">
    <div class="code-line">console.log("Starting app...");</div>
    <div class="code-line">let x = 10;</div>
    <div class="code-line">function hello() &#123; alert("Hello!"); &#125;</div>
    <div class="code-line">console.log("Running...");</div>

    <a href="https://wa.me/6285850539404" target="_blank" rel="noopener noreferrer" title="Chat me on WhatsApp">
      <img class="wa-logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Bot Logo" />
    </a>
  </div>

</body>
</html>
