<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oscar Dev - Home</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  .typing-container {
    width: 100%;
    background-color: #000;
    color: #fff;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: bold;
    font-size: 18px;
    white-space: nowrap;
    overflow: hidden;
    box-sizing: border-box;
    margin-top: 20px;
    font-family: monospace, monospace;
  }
  .typing-cursor {
    display: inline-block;
    width: 3px;
    background-color: #fff;
    animation: blink 1s steps(2, start) infinite;
    margin-left: 5px;
    vertical-align: bottom;
  }
  @keyframes blink {
    0%, 50% {opacity: 1;}
    50.01%, 100% {opacity: 0;}
  }

  /* Robot container under typing */
  .robot-typing-container {
    display: flex;
    justify-content: center;
    margin-top: 25px;
  }

  /* Robot SVG size and float animation */
  .robot-typing {
    width: 150px;
    height: 150px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% {transform: translateY(0);}
    50% {transform: translateY(-15px);}
  }

  /* Laptop screen glow effect */
  .screen-glow {
    animation: glow 2s ease-in-out infinite alternate;
    fill: #32cd32;
  }
  @keyframes glow {
    0% {fill-opacity: 0.3;}
    100% {fill-opacity: 1;}
  }

  /* Typing code lines blinking */
  .code-line {
    fill: #32cd32;
    opacity: 0;
    animation: codeBlink 1.5s infinite;
  }
  .code-line:nth-child(1) { animation-delay: 0s; }
  .code-line:nth-child(2) { animation-delay: 0.5s; }
  .code-line:nth-child(3) { animation-delay: 1s; }

  @keyframes codeBlink {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Oscar Dev</div>
  <nav id="nav-menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html">Product</a></li>
      <li><a href="payment.html">Payment</a></li>
      <li><a href="saluran.html">Saluran</a></li>
    </ul>
  </nav>
  <div class="hamburger" id="hamburger">
    <i class="fas fa-bars"></i>
  </div>
</header>

<section class="portfolio">
  <img src="foto.jpg" alt="Portfolio Image" />
  <h1>Welcome to Oscar Dev</h1>

  <div class="typing-container" id="typing">
    <span id="typed-text"></span><span class="typing-cursor"></span>
  </div>

  <!-- Robot coding animasi di bawah typing -->
  <div class="robot-typing-container" aria-label="Animated coding robot" role="img">
    <svg class="robot-typing" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <!-- Body -->
      <rect x="20" y="18" width="24" height="25" rx="5" ry="5" fill="#444" stroke="#222" stroke-width="2"/>
      <!-- Head -->
      <circle cx="32" cy="14" r="8" fill="#666" stroke="#222" stroke-width="2"/>
      <!-- Eyes -->
      <circle cx="28" cy="14" r="2" fill="#32cd32" />
      <circle cx="36" cy="14" r="2" fill="#32cd32" />
      <!-- Antenna -->
      <line x1="32" y1="6" x2="32" y2="10" stroke="#32cd32" stroke-width="2" />
      <circle cx="32" cy="6" r="2" fill="#32cd32" />
      <!-- Laptop base -->
      <rect x="16" y="43" width="32" height="8" fill="#333" stroke="#111" stroke-width="2" rx="2" ry="2" />
      <!-- Laptop screen -->
      <rect x="18" y="30" width="28" height="15" rx="2" ry="2" fill="#111" stroke="#111" stroke-width="2" />
      <!-- Screen glow -->
      <rect class="screen-glow" x="20" y="32" width="24" height="11" rx="2" ry="2" />
      <!-- Coding lines on screen -->
      <rect class="code-line" x="24" y="34" width="16" height="2" rx="1" />
      <rect class="code-line" x="24" y="38" width="12" height="2" rx="1" />
      <rect class="code-line" x="24" y="42" width="20" height="2" rx="1" />
    </svg>
  </div>
</section>

<footer>
  <h3>Follow Me</h3>
  <div class="social-icons">
    <a href="https://wa.me/6285850539404" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i></a>
    <a href="https://www.instagram.com/jarotr_" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
    <a href="https://www.youtube.com/channel/UCxxxxxxx" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
    <a href="https://github.com/jarotr" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
  </div>
  <p>© 2025 Oscar Dev. All rights reserved.</p>
</footer>

<script>
  const hamburger = document.getElementById('hamburger');
  const navMenu = document.getElementById('nav-menu');

  hamburger.addEventListener('click', () => {
    navMenu.classList.toggle('active');
  });

  // Typing effect script
  const text = "Halo, saya Oscar, seorang developer yang memiliki passion dalam membangun aplikasi dan sistem yang inovatif dan efektif. Saya memiliki pengalaman dalam mengembangkan berbagai jenis aplikasi, mulai dari web hingga mobile, dan memiliki kemampuan dalam menggunakan berbagai teknologi dan bahasa pemrograman.";
  const typedTextSpan = document.getElementById('typed-text');
  let charIndex = 0;
  const typingDelay = 40; // ms per karakter

  function type() {
    if (charIndex < text.length) {
      typedTextSpan.textContent += text.charAt(charIndex);
      charIndex++;
      setTimeout(type, typingDelay);
    }
  }
  type();
</script>

</body>
</html>
